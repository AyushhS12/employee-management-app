<mat-drawer-container>
    <mat-drawer-content>
        <div class="main" *ngIf="departments">
            <div class="mt-3">
                <h2>All Departments</h2>
                <div class="search-and-add d-flex justify-content-between align-items-center">
                    <button (click)="addDepartmentDrawer.opened = !addDepartmentDrawer.opened"
                        class="btn btn-outline-dark fw-bold">Add Department</button>
                </div>
            </div>
            <div class="department-table border border-black">
                <table mat-table matSort [dataSource]="dataSource" class="table table-hover table-bordered">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
                        <td mat-cell *matCellDef="let dept">{{dept.id}}</td>
                    </ng-container>
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                        <td mat-cell *matCellDef="let dept">{{dept.name}}</td>
                    </ng-container>

                    <ng-container matColumnDef="count">
                        <th mat-header-cell *matHeaderCellDef>Employee Count</th>
                        <td mat-cell *matCellDef="let dept">{{ dept.employees.length }}</td>
                    </ng-container>

                    <ng-container matColumnDef="employees">
                        <th mat-header-cell *matHeaderCellDef>Show Employees</th>
                        <td mat-cell *matCellDef="let dept">
                            <button [disabled]="dept.employees.length==0" [ngClass]="dept.employees.length==0?'btn btn-info':'btn btn-outline-primary'" [routerLink]="['/department',dept.name]">Show Employees</button>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Actions</th>
                        <td mat-cell *matCellDef="let dept">
                            <button (click)="handleDelete(dept.id)" class="btn btn-outline-danger" mat-icon-button><img src="/assets/delete.svg" alt="delete" /></button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="departmentColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns:departmentColumns"></tr>
                </table>
            </div>
        </div>
    </mat-drawer-content>
    <mat-drawer #addDepartmentDrawer position="end" [disableClose]="true">
        <app-add-department (closeDrawer)="addDepartmentDrawer.opened = false" (departmentAdded)="handleDepartmentAdded($event)"></app-add-department>
    </mat-drawer>
</mat-drawer-container>
