<mat-card>
    <div>
        <mat-card-header>
            <mat-card-title>
                <strong class="title">Employee Id: {{employee.id}}</strong><br>
            </mat-card-title>
        </mat-card-header>
        <ng-container *ngIf="!editMode; else editFields">
            <mat-card-content>
                <span *ngFor="let item of employee | keyvalue">
                    <span *ngIf="item.key=='id'; else elseBlock"></span>
                    <ng-template #elseBlock>
                        <b>{{item.key}}</b>: {{$any(item.value).name ?? item.value}}
                        <br>
                    </ng-template>
                </span>
            </mat-card-content>
        </ng-container>
        <ng-template #editFields>
            <mat-card-content>
                <form #editForm="ngForm" class="edit-form">
                    <ng-container *ngFor="let item of employee | keyvalue">
                        <ng-container [ngSwitch]="item.key">
                            <ng-container *ngSwitchCase="'id'"></ng-container>
                            <ng-container *ngSwitchCase="'department'">
                                <app-fancy-select title="Department" [ngModel]="$any(item.value).name" [name]="item.key" [selected]="$any(item.value).name"
                                    [items]="departments"></app-fancy-select>
                            </ng-container>
                            <ng-container *ngSwitchCase="'role'">
                                <app-fancy-select title="Role" [ngModel]="item.value" [name]="item.key" [selected]="item.value.toString()"
                                    [items]="roles"></app-fancy-select>
                            </ng-container>
                            <ng-container *ngSwitchDefault>
                                <app-fancy-input [label]="item.key | titlecase" required [name]="item.key"
                                    [ngModel]="($any(item.value).name ?? item.value)"></app-fancy-input>
                            </ng-container>
                        </ng-container>
                    </ng-container>
                </form>
            </mat-card-content>
        </ng-template>
    </div>
